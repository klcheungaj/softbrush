[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"

[target.'cfg(all(target_os = "linux", target_env = "musl"))']
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-Wl,-u,malloc",
    "-C", "link-arg=-Wl,-u,calloc",
    "-C", "link-arg=-Wl,-u,realloc",
    "-C", "link-arg=-Wl,-u,free",
    "-C", "link-arg=-Wl,-u,aligned_alloc",
    "-C", "link-arg=-Wl,-u,posix_memalign",
    "-C", "link-arg=-Wl,-u,memalign",
    "-C", "link-arg=-Wl,-u,malloc_usable_size",
    "-C", "link-arg=-Wl,-u,reallocarray",
    "-C", "link-arg=-Wl,-u,__libc_malloc",
    "-C", "link-arg=-Wl,-u,__libc_calloc",
    "-C", "link-arg=-Wl,-u,__libc_realloc",
    "-C", "link-arg=-Wl,-u,__libc_free",
]

[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
# Bundle the MSVC/UCRT runtime. Windows system DLLs remain dynamically linked.
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# libmimalloc-sys compiles mimalloc's C source and therefore needs a compiler
# that targets musl in addition to Cargo's final-linker configuration.
CC_x86_64_unknown_linux_musl = { value = "musl-gcc", force = false }
CC_aarch64_unknown_linux_musl = { value = "musl-gcc", force = false }
