[package]
name = "softbrush_ls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A tolerant Tcl, SDC, and XDC language server"
license = "GPL-2.0-only"

[[bin]]
name = "softbrush_ls"
path = "src/main.rs"

[dependencies]
antlr-rust-runtime = "=0.34.0"
dashmap = "5.5"
mimalloc = { version = "0.1.50", default-features = false, features = ["override"] }
strsim = "0.11"
tokio = { version = "1.47", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp = "0.20"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
