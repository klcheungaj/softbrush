version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-runtime-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /tools/parser-generator
    schedule:
      interval: weekly
    groups:
      rust-generator-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
