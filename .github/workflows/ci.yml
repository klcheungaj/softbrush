name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: |
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 fmt --manifest-path tools/parser-generator/Cargo.toml --all --check
      - name: Check generated parser
        run: ./scripts/generate-parser.sh --check
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
      - name: Run tests
        run: |
          cargo +1.95.0 test --locked --all-targets --target x86_64-unknown-linux-gnu
          cargo +1.95.0 test --locked --manifest-path tools/parser-generator/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Run Clippy
        run: |
          cargo +1.95.0 clippy --locked --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
          cargo +1.95.0 clippy --locked --manifest-path tools/parser-generator/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
      - name: Check public API documentation
        run: cargo +1.95.0 doc --locked --no-deps --target x86_64-unknown-linux-gnu
        env:
          RUSTDOCFLAGS: -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked
      - name: Audit language server dependencies
        run: cargo +stable audit --file Cargo.lock --deny unsound
      - name: Audit parser generator dependencies
        # antlr-rust-codegen currently brings build-only, unmaintained UNIC
        # crates through RustPython. Vulnerabilities and unsoundness still fail.
        run: cargo +stable audit --file tools/parser-generator/Cargo.lock --deny unsound

  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (musl)
            runner: ubuntu-24.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/softbrush_ls
          - name: Linux ARM64 (musl)
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/softbrush_ls
          - name: Windows x64 (MSVC)
            runner: windows-2025
            os: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/softbrush_ls.exe
          - name: Windows ARM64 (MSVC)
            runner: windows-11-vs2026-arm
            os: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/softbrush_ls.exe
          - name: macOS ARM64
            runner: macos-15
            os: macos
            arch: arm64
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/softbrush_ls
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and target
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build Linux release
        if: matrix.os == 'linux'
        shell: bash
        run: ./scripts/build-linux.sh --arch ${{ matrix.arch }}
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
      - name: Build Windows/macOS release
        if: matrix.os != 'linux'
        run: cargo +1.95.0 build --locked --release --target ${{ matrix.target }}
      - name: Run Linux target test suite
        if: matrix.os == 'linux'
        run: cargo +1.95.0 test --locked --all-targets --target ${{ matrix.target }}
        env:
          CC: musl-gcc
      - name: Run Windows/macOS target test suite
        if: matrix.os != 'linux'
        run: cargo +1.95.0 test --locked --all-targets --target ${{ matrix.target }}
      - name: Run Linux end-to-end tests against release executable
        if: matrix.os == 'linux'
        run: cargo +1.95.0 test --locked --test lsp_e2e --target ${{ matrix.target }}
        env:
          CC: musl-gcc
          SOFTBRUSH_LS_BIN: ${{ github.workspace }}/${{ matrix.binary }}
      - name: Run Windows/macOS end-to-end tests against release executable
        if: matrix.os != 'linux'
        run: cargo +1.95.0 test --locked --test lsp_e2e --target ${{ matrix.target }}
        env:
          SOFTBRUSH_LS_BIN: ${{ github.workspace }}/${{ matrix.binary }}
      - name: Verify Linux static linkage
        if: matrix.os == 'linux'
        shell: bash
        run: ./scripts/verify-musl.sh ${{ matrix.binary }}
      - name: Verify Windows static runtime linkage
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Binary ${{ matrix.binary }} -Architecture ${{ matrix.arch }}
      - name: Verify macOS system-library linkage
        if: matrix.os == 'macos'
        shell: bash
        run: ./scripts/verify-macos.sh ${{ matrix.binary }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GNU development image
        run: docker build --target gnu-dev --tag softbrush_ls:dev .
      - name: Run tests in GNU development image
        run: docker run --rm softbrush_ls:dev
      - name: Build Alpine musl image
        run: docker build --tag softbrush_ls:musl .
      - name: Smoke-test container entrypoint
        run: docker run --rm --interactive softbrush_ls:musl </dev/null
