name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artifacts:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            os: linux
            arch: x86_64
            release_arch: x64
            archive_extension: tar.gz
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/softbrush_ls
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            release_arch: arm64
            archive_extension: tar.gz
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/softbrush_ls
          - name: Windows x64
            runner: windows-2025
            os: windows
            arch: x64
            release_arch: x64
            archive_extension: zip
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/softbrush_ls.exe
          - name: Windows ARM64
            runner: windows-11-vs2026-arm
            os: windows
            arch: arm64
            release_arch: arm64
            archive_extension: zip
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/softbrush_ls.exe
          - name: macOS ARM64
            runner: macos-15
            os: macos
            arch: arm64
            release_arch: arm64
            archive_extension: tar.gz
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/softbrush_ls
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: softbrush_ls-${{ github.event.release.tag_name }}-${{ matrix.os }}-${{ matrix.release_arch }}.${{ matrix.archive_extension }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain and target
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build Linux release
        if: matrix.os == 'linux'
        shell: bash
        run: ./scripts/build-linux.sh --arch ${{ matrix.arch }}
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
      - name: Build Windows/macOS release
        if: matrix.os != 'linux'
        run: cargo +1.95.0 build --locked --release --target ${{ matrix.target }}
      - name: Run Linux target test suite
        if: matrix.os == 'linux'
        run: cargo +1.95.0 test --locked --all-targets --target ${{ matrix.target }}
        env:
          CC: musl-gcc
      - name: Run Windows/macOS target test suite
        if: matrix.os != 'linux'
        run: cargo +1.95.0 test --locked --all-targets --target ${{ matrix.target }}
      - name: Run Linux end-to-end tests against release executable
        if: matrix.os == 'linux'
        run: cargo +1.95.0 test --locked --test lsp_e2e --target ${{ matrix.target }}
        env:
          CC: musl-gcc
          SOFTBRUSH_LS_BIN: ${{ github.workspace }}/${{ matrix.binary }}
      - name: Run Windows/macOS end-to-end tests against release executable
        if: matrix.os != 'linux'
        run: cargo +1.95.0 test --locked --test lsp_e2e --target ${{ matrix.target }}
        env:
          SOFTBRUSH_LS_BIN: ${{ github.workspace }}/${{ matrix.binary }}
      - name: Verify Linux static linkage and allocator override
        if: matrix.os == 'linux'
        shell: bash
        run: ./scripts/verify-musl.sh ${{ matrix.binary }}
      - name: Verify Windows static runtime linkage
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/verify-windows.ps1 -Binary ${{ matrix.binary }} -Architecture ${{ matrix.arch }}
      - name: Verify macOS system-library linkage
        if: matrix.os == 'macos'
        shell: bash
        run: ./scripts/verify-macos.sh ${{ matrix.binary }}
      - name: Package Unix executable
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          install -m 755 "${{ matrix.binary }}" dist/softbrush_ls
          install -m 644 LICENSE README.md dist/
          tar -C dist -czf "$ARCHIVE" softbrush_ls LICENSE README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - name: Package Windows executable
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath "${{ matrix.binary }}" -Destination dist/softbrush_ls.exe
          Copy-Item -LiteralPath LICENSE, README.md -Destination dist
          Compress-Archive -Path dist/softbrush_ls.exe, dist/LICENSE, dist/README.md -DestinationPath "$env:ARCHIVE"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:ARCHIVE).Hash.ToLowerInvariant()
          "$hash  ${env:ARCHIVE}" | Set-Content -Encoding ascii "${env:ARCHIVE}.sha256"
      - name: Upload release assets
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
