name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build official musl executable
        run: docker build --target musl-artifact --output type=local,dest=release-root .
      - name: Verify official executable
        run: ./scripts/verify-musl.sh release-root/softbrush_ls
      - name: Run end-to-end tests against official executable
        run: cargo +1.95.0 test --locked --test lsp_e2e --target x86_64-unknown-linux-gnu
        env:
          SOFTBRUSH_LS_BIN: ${{ github.workspace }}/release-root/softbrush_ls
      - name: Package executable
        run: |
          archive=softbrush_ls-x86_64-unknown-linux-musl.tar.gz
          mkdir -p dist
          install -m 755 release-root/softbrush_ls dist/softbrush_ls
          install -m 644 LICENSE README.md dist/
          tar -C dist -czf "$archive" softbrush_ls LICENSE README.md
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload official release assets
        run: |
          archive=softbrush_ls-x86_64-unknown-linux-musl.tar.gz
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
