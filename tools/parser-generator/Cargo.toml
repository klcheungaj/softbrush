[package]
name = "softbrush-parser-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
antlr-rust-codegen = "=0.34.0"
# rustpython-vm 0.5.0 assumes the pre-0.2.187 POSIX_SPAWN_SETSID type.
libc = "=0.2.186"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
